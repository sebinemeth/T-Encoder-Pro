; PlatformIO project for the Home Assistant controller on LilyGO T-Encoder-Pro.
; Hardware variant (display/touch) is selected in libraries/Mylibrary/pin_config.h.

[platformio]
boards_dir = ./boards
lib_dir = ./libraries
src_dir = examples/HomeAssistant_LVGL
default_envs = HomeAssistant_LVGL

[env:HomeAssistant_LVGL]
platform = espressif32@6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.memory_type = qio_opi ; internal octal PSRAM
board_build.partitions = default_16MB.csv
build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; USB port is the serial console
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.4.1

; Host-side unit tests for the pure logic headers: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++14
    -Wall
    -Wextra
    -I examples/HomeAssistant_LVGL
    -I examples/HomeAssistant_LVGL/port
